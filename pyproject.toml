[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfilings"
version = "0.21.0"
description = "Search, parse, and normalize public filings across global markets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "finvariant>=0.1,<0.2",
  "httpx>=0.28,<1",
  "markdownify>=1.2,<2",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "pymupdf4llm>=1.28,<2",
  "rapidfuzz>=3.9,<4",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.2,<4"]
pdf-detect = ["pdf-inspector>=0.2,<0.3"]

[project.scripts]
openfilings = "openfilings.cli:app"
openfilings-smoke = "openfilings.smoke:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/openfilings"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
