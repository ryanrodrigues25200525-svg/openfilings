[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfilings"
version = "0.4.0"
description = "Search, parse, and normalize UK corporate filings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "markdownify>=1.2,<2",
  "mcp>=1.27,<2",
  "pydantic>=2.10,<3",
  "pymupdf4llm>=0.3.4,<0.4",
  "typer>=0.15,<1",
]

[project.scripts]
openfilings = "openfilings.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["src/openfilings"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
